<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planejador de Aulas</title>

<!-- PWA: permite instalar o app na tela inicial -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B4552F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planejador">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo no-print">
    <div>
      <p class="eyebrow">Meu acervo</p>
      <h1>Planejador de Aulas</h1>
    </div>
    <div class="topo-acoes">
      <button id="botao-instalar" class="botao-secundario" hidden>Instalar app</button>
      <button id="botao-novo" class="botao-primario">+ Novo plano</button>
    </div>
  </header>

  <div id="banner-demo" class="banner-demo no-print" hidden>
    Modo demonstração — os planos não estão sendo salvos numa planilha real.
    Configure <code>CONFIG.API_URL</code> em <code>script.js</code> para conectar ao Google Sheets.
  </div>

  <!-- ================= LISTA ================= -->
  <main id="tela-lista" class="no-print">
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar por palavra-chave, objetivo, habilidade...">
      <select id="filtro-disciplina">
        <option value="">Todas as disciplinas</option>
      </select>
      <select id="filtro-turma">
        <option value="">Todas as turmas</option>
      </select>
    </div>

    <section id="lista-planos" class="lista-planos"></section>
    <p id="lista-vazia" class="lista-vazia" hidden>Nenhum plano encontrado. Crie o primeiro com "+ Novo plano".</p>
  </main>

  <!-- ================= FORMULÁRIO ================= -->
  <main id="tela-formulario" class="no-print" hidden>
    <button id="botao-voltar" class="botao-link">&larr; Voltar para a lista</button>
    <h2 id="titulo-formulario">Novo plano de aula</h2>

    <form id="form-plano">
      <input type="hidden" id="campo-id">

      <div class="linha-campos">
        <label>
          Disciplina
          <input type="text" id="campo-disciplina" placeholder="Ex: Matemática" required>
        </label>
        <label>
          Turma
          <input type="text" id="campo-turma" placeholder="Ex: 7º ano B" required>
        </label>
        <label>
          Data
          <input type="date" id="campo-data" required>
        </label>
      </div>

      <label>
        Habilidade da BNCC (opcional)
        <input type="text" id="campo-habilidade" placeholder="Ex: EF07MA05">
      </label>

      <label>
        Objetivo da aula
        <textarea id="campo-objetivo" rows="2" required></textarea>
      </label>

      <label>
        Desenvolvimento da aula
        <textarea id="campo-desenvolvimento" rows="6" placeholder="Etapas, tempo estimado de cada uma, dinâmica usada..." required></textarea>
      </label>

      <label>
        Recursos necessários
        <textarea id="campo-recursos" rows="2"></textarea>
      </label>

      <label>
        Forma de avaliação
        <textarea id="campo-avaliacao" rows="2"></textarea>
      </label>

      <div class="acoes-formulario">
        <button type="submit" class="botao-primario">Salvar plano</button>
      </div>
    </form>
  </main>

  <!-- ================= DETALHE / IMPRESSÃO ================= -->
  <main id="tela-detalhe" hidden>
    <div class="no-print acoes-detalhe">
      <button id="botao-voltar-detalhe" class="botao-link">&larr; Voltar para a lista</button>
      <div>
        <button id="botao-editar" class="botao-secundario">Editar</button>
        <button id="botao-duplicar" class="botao-secundario">Duplicar</button>
        <button id="botao-imprimir" class="botao-secundario">Imprimir / PDF</button>
        <button id="botao-excluir" class="botao-perigo">Excluir</button>
      </div>
    </div>

    <article id="conteudo-detalhe" class="plano-impresso"></article>
  </main>

  <p id="mensagem-erro" class="mensagem-erro no-print" role="alert" hidden></p>

  <script src="script.js"></script>
</body>
</html>
